name: leadflow-test
services:
  postgres:
    image: postgres:17-alpine
    networks: [backend]
    environment:
      POSTGRES_DB: leadflow_test
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: test_only
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow -d leadflow_test"]
      interval: 2s
      timeout: 5s
      retries: 20
  solr:
    image: solr:9.8
    networks: [backend]
    command: ["solr-precreate", "leads_test"]
    ports: ["127.0.0.1:58983:8983"]
    tmpfs: ["/var/solr:uid=8983,gid=8983"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8983/solr/leads_test/admin/ping' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30

networks:
  backend:
    driver: bridge
